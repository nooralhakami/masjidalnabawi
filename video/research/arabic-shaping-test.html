<!doctype html>
<html lang="ar" dir="rtl" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Kufi;src:url(fonts/kufi700.woff2) format('woff2');font-weight:700}
@font-face{font-family:Plex;src:url(fonts/plex600.woff2) format('woff2');font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0F1714}
#root{width:100%;height:100%;position:relative;color:#ECE8DF}
.row{position:absolute;right:120px;font:700 64px/1.5 Kufi}
#r1{top:90px;color:#8FD3B4} #r2{top:260px} #r3{top:430px} #r4{top:600px;font:600 40px/1.6 Plex;color:#C9A15B}
.w,.c{display:inline-block}
.lbl{position:absolute;left:80px;font:600 26px Plex;color:#A3B2AB;direction:ltr}
.phone{position:absolute;left:180px;top:120px;width:380px;height:822px;border-radius:64px;background:#111;padding:14px;box-shadow:0 40px 80px rgb(0 0 0/.5),inset 0 0 0 2px #333}
.phone img{width:100%;height:100%;object-fit:cover;border-radius:52px;display:block}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
  <div id="r1" class="row clip" data-start="0" data-duration="3" data-track-index="0"></div>
  <div id="r2" class="row clip" data-start="0" data-duration="3" data-track-index="1"></div>
  <div id="r3" class="row clip" data-start="0" data-duration="3" data-track-index="2"></div>
  <div id="r4" class="row clip" data-start="0" data-duration="3" data-track-index="3">باب عمر بن الخطاب — رقم 17 · ويقع ضمن القسم النسائي</div>
  <div class="phone clip" id="ph" data-start="0" data-duration="3" data-track-index="4"><img src="../assets/screens/G-01-gate17-women.png"></div>
</div>
<script>
const T='دليل زوار المسجد النبوي';
const ZWJ='‍';
const nonJoinAfter=new Set('اأإآدذرزوؤةء ى'.split('')); // letters that never join to the following letter
// row1: word-level
r1.innerHTML=T.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');
// row2: naive per-char (expected broken)
r2.innerHTML=[...T].map(ch=>ch===' '?' ':`<span class="c">${ch}</span>`).join('');
// row3: per-char with ZWJ on both sides where the letters join
const chars=[...T];
r3.innerHTML=chars.map((ch,i)=>{if(ch===' ')return ' ';const prev=chars[i-1],next=chars[i+1];
  const joinPrev=prev&&prev!==' '&&!nonJoinAfter.has(prev),joinNext=next&&next!==' '&&!nonJoinAfter.has(ch);
  return `<span class="c">${joinPrev?ZWJ:''}${ch}${joinNext?ZWJ:''}</span>`}).join('');
const tl=gsap.timeline({paused:true});
tl.from('#r1 .w',{opacity:0,y:40,duration:.7,stagger:.12,ease:'power3.out'},0);
tl.from('#r3 .c',{opacity:0,y:30,duration:.5,stagger:.04,ease:'power3.out'},.2);
tl.from('#ph',{opacity:0,y:60,scale:.94,duration:.9,ease:'expo.out'},0);
window.__timelines["main"]=tl;tl.seek(0);
</script>
</body>
</html>
