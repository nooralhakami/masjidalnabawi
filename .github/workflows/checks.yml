# The gate before anything reaches main (and so the live site): the types, the unit tests and the
# production build must pass on every pull request. It also runs on main itself, so GitHub can offer
# it as a required check and Vercel can wait for it before the site changes.
# Actions are pinned to a commit, not a tag: a moved tag cannot change what runs here.
name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # From the lockfile only; no package's install script runs.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
