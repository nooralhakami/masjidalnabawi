			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}

		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);

	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {

							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;

						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {

		var data = dataList[i];

		totalDataCount += rsBlocks[x].dataCount;

            buffer.getLengthInBits() + 
            ">" +

		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}

			break;

QRCode.createBytes = function(buffer, rsBlocks) {

		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);

	for (var z = 0; z < maxDcCount; z++) {

			if (z < dcdata[s].length) {

		for (var t = 0; t < rsBlocks.length; t++) {

function match(p){

  if(c==='toilets'){if(p.category!=='toilets')return false;if(state.sub==='open'&&p.status!=='open')return false;if(state.sub==='maintenance'&&p.status==='open')return false;}

/* ===== مسار المشي: يسير في ممرات الساحات داخل حدود الحرم ولا يقطع المسجد ولا يخرج إلى البقيع ===== */
const LAT0=GEO_ANCHOR.lat,LNG0=GEO_ANCHOR.lng,KY=111320,KX=111320*Math.cos(LAT0*Math.PI/180);
const toM=ll=>[(ll[1]-LNG0)*KX,(ll[0]-LAT0)*KY],fromM=m=>[LAT0+m[1]/KY,LNG0+m[0]/KX];
// حلقة الممرات (بإحداثيات خريطة PDF): الساحة الجنوبية ← الغربية ← الشمالية ← وسط الساحة الشرقية بين المرافق
// ← بمحاذاة البوابات 353-360 بجوار البقيع ← عودة للساحة الجنوبية
const RING_PX=[[210,150],[873,150],[873,833],[141,833],[141,440],[210,404]];

let _net=null;
function netInfo(){if(_net)return _net;
  const ring=RING_PX.map(q=>pxM(q[0],q[1])),seg=[];let P=0;
  ring.forEach((a,i)=>{const b=ring[(i+1)%ring.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push({a,b,l,t0:P});P+=l;});
  const mosque=rectM(215,310,770,700,3),baqi=rectM(0,100,192,400,0); // جسم المسجد، ومنطقة البقيع خارج الحرم
  return _net={ring,seg,P,mosque,obst:[mosque,baqi]};}
function segHits(a,b,r){const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2));
  for(let i=0;i<=n;i++){const x=a[0]+(b[0]-a[0])*i/n,y=a[1]+(b[1]-a[1])*i/n;if(x>r.x0&&x<r.x1&&y>r.y0&&y<r.y1)return true;}return false;}
const hitsAny=(a,b,N)=>N.obst.some(r=>segHits(a,b,r));

function projRing(p,N){let best=null;
  N.seg.forEach(sg=>{const dx=sg.b[0]-sg.a[0],dy=sg.b[1]-sg.a[1];let u=((p[0]-sg.a[0])*dx+(p[1]-sg.a[1])*dy)/(sg.l*sg.l);u=Math.max(0,Math.min(1,u));
    const q=[sg.a[0]+dx*u,sg.a[1]+dy*u],d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(!best||d<best.d)best={d,p:q,t:sg.t0+u*sg.l};});

function roundPath(P,r){if(P.length<3)return P;const o=[P[0]];
  for(let i=1;i<P.length-1;i++){const v=P[i],a=P[i-1],b=P[i+1],l1=Math.hypot(v[0]-a[0],v[1]-a[1]),l2=Math.hypot(b[0]-v[0],b[1]-v[1]);
    if(!l1||!l2){o.push(v);continue;}
    const d1=Math.min(r,l1/2),d2=Math.min(r,l2/2),s=[v[0]+(a[0]-v[0])*d1/l1,v[1]+(a[1]-v[1])*d1/l1],e=[v[0]+(b[0]-v[0])*d2/l2,v[1]+(b[1]-v[1])*d2/l2];
    for(let k=0;k<=6;k++){const u=k/6;o.push([(1-u)*(1-u)*s[0]+2*u*(1-u)*v[0]+u*u*e[0],(1-u)*(1-u)*s[1]+2*u*(1-u)*v[1]+u*u*e[1]]);}}
  o.push(P[P.length-1]);return o;}
function walkPath(a,b){
  const N=netInfo(),A=toM(a),B=toM(b);let pts=null;
  // مسار قصير مباشر بزاوية قائمة إن لم يمر بالمسجد أو البقيع
  if(Math.hypot(A[0]-B[0],A[1]-B[1])<150){
    for(const c of [[B[0],A[1]],[A[0],B[1]]]){if(!hitsAny(A,c,N)&&!hitsAny(c,B,N)){pts=[A,c,B];break;}}}
  if(!pts){
    const qa=projRing(A,N),qb=projRing(B,N),P=N.P;
    let df=((qb.t-qa.t)%P+P)%P;const fwd=df<=P/2;if(!fwd)df=P-df;
    pts=[A,qa.p];const mid=[];
    N.seg.forEach((sg,i)=>{const d=fwd?((sg.t0-qa.t)%P+P)%P:((qa.t-sg.t0)%P+P)%P;if(d>0.5&&d<df-0.5)mid.push([d,N.ring[i]]);});
    mid.sort((x,y)=>x[0]-y[0]).forEach(m=>pts.push(m[1]));
    pts.push(qb.p,B);}
  const clean=[pts[0]];for(let i=1;i<pts.length;i++){const l=clean[clean.length-1];if(Math.hypot(pts[i][0]-l[0],pts[i][1]-l[1])>0.5)clean.push(pts[i]);}
  return roundPath(clean,6).map(fromM);}
async function drawRoute(p){
  const ri=$('#ri');ri.style.display='block';
  if(!userLL){ri.textContent=t('locating');await locate(false);}
  if(!userLL){ri.textContent=t('route_fail');return;}
  if(routeLine)map.removeLayer(routeLine);
  const path=walkPath(userLL,p.coords);
  const casing=L.polyline(path,{color:'#fff',weight:10,opacity:.95,lineCap:'round',lineJoin:'round'});
  const line=L.polyline(path,{color:'#1A73E8',weight:5.5,lineCap:'round',lineJoin:'round'});
  const dest=L.circleMarker(p.coords,{radius:7,color:'#fff',weight:3,fillColor:'#1A73E8',fillOpacity:1});
  routeLine=L.featureGroup([casing,line,dest]).addTo(map);
  map.fitBounds(routeLine.getBounds(),{padding:[50,50],maxZoom:19});
  let m=0;for(let i=1;i<path.length;i++)m+=hav(path[i-1],path[i]);m=Math.round(m);
  ri.textContent=t('route_res').replace('{m}',m).replace('{t}',Math.max(1,Math.ceil(m/80)));
}
/* ========== GPS ========== */
function locate(fly){
  return new Promise(res=>{
    if(!navigator.geolocation){alert(t('geo_unsup'));return res();}
    navigator.geolocation.getCurrentPosition(pos=>{
      const ll=[pos.coords.latitude,pos.coords.longitude],km=hav(ll,[24.4672,39.6111])/1000;
      if(km>3){alert(t('geo_far').replace('{k}',km.toFixed(1)));return res();}
      userLL=ll;if(userMk)map.removeLayer(userMk);
      userMk=L.marker(ll,{icon:L.divIcon({className:'mw',html:'<div class="pulse"></div>',iconSize:[22,22]}),interactive:false}).addTo(map);
      if(fly)map.flyTo(ll,19);res();
    },()=>{alert(t('geo_deny'));res();},{enableHighAccuracy:true,timeout:10000});
  });
}
$('#gps').onclick=()=>locate(true);

$('#pills').onclick=e=>{const b=e.target.closest('.pill');if(!b)return;
  document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x===b));
  state.cat=b.dataset.c;state.sub='all';$('#subs').classList.toggle('hidden',state.cat!=='toilets');
  document.querySelectorAll('.subpill').forEach(x=>x.classList.toggle('active',x.dataset.s==='all'));render();};
$('#subs').onclick=e=>{const b=e.target.closest('.subpill');if(!b)return;
  document.querySelectorAll('.subpill').forEach(x=>x.classList.toggle('active',x===b));state.sub=b.dataset.s;render();};
let tm;const $q=$('#q'),$res=$('#res');
$q.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{state.q=$q.value.trim();render();showRes();},200);};
$q.onkeydown=e=>{if(e.key==='Enter'&&vis.length&&state.q){pick(vis[0]);}};
function showRes(){
  if(!state.q){$res.classList.remove('show');return;}
  $res.innerHTML=vis.length?'':`<div class="none">${t('nores2')}</div>`;
  vis.slice(0,8).forEach(p=>{const b=document.createElement('button');
    b.innerHTML=`<span>${emoji(p)||'🚪'}</span><span>${nm(p)}</span>`;b.onclick=()=>pick(p);$res.appendChild(b);});
  $res.classList.add('show');
}
function pick(p){$res.classList.remove('show');$q.blur();select(p,true);}

/* ========== محاكاة المشرف ========== */
const $as=$('#asel');
function fillAdmin(){const v=$as.value;
  $as.innerHTML='';pois.filter(p=>p.category==='toilets').forEach(p=>{
    const o=document.createElement('option');o.value=p.id;o.textContent=`${nm(p)} — ${p.status==='open'?t('a_open'):p.status==='works'?t('a_works'):t('a_maint')}`;$as.appendChild(o);});
  if(v)$as.value=v;}
$('#atog').onclick=()=>{const p=byId.get(+$as.value);if(!p)return;
  if(p.status==='works')setWorks(p.worksBy||p.id,false);else p.status=p.status==='open'?'maintenance':'open';fillAdmin();
  if(state.sel===p.id)select(p);else render();};
$('#awk').onclick=()=>{const p=byId.get(+$as.value);if(!p)return;
  const main=ELEV_WOMEN.includes(p.id)?p.id:(p.worksBy||(ELEV_WOMEN.includes(WORKS_PAIR[p.id])?WORKS_PAIR[p.id]:null));
  if(!main)return;setWorks(main,byId.get(main).status!=='works');fillAdmin();
  if(state.sel!==null&&byId.get(state.sel))select(byId.get(state.sel));else render();};
fillAdmin();

document.querySelectorAll('.langmenu').forEach(menu=>{

/* ===== الصفحة الرئيسية والباركود والتوجيه ===== */
const qs=new URLSearchParams(location.search);
const MAP_URL=APP_CONFIG.QR_URL||qs.get('qr')||(location.href.split('#')[0].split('?')[0]+'#map');
function buildQR(){const box=$('#qrBox');$('#qrLink').textContent=MAP_URL;box.innerHTML='';
  if(APP_CONFIG.QR_IMAGE){const im=new Image();im.src=APP_CONFIG.QR_IMAGE;im.width=200;im.alt='QR';box.appendChild(im);return;}
  try{const Q=new __QR.QRCode(-1,__QR.L.M);Q.addData(MAP_URL);Q.make();const n=Q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(Q.isDark(r,c))d+='M'+(c+3)+' '+(r+3)+'h1v1h-1z';
    box.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+6)+' '+(n+6)+'" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#111"/></svg>';return;}catch(e){}
  box.textContent=MAP_URL;}
if(APP_CONFIG.ORG_NAME)$('#orgName').textContent=APP_CONFIG.ORG_NAME;
buildQR();
let fitted=false;
function route(){const m=location.hash==='#map'||qs.has('map');document.body.classList.toggle('landing',!m);
  if(!m){closeSheet();return;}
  setTimeout(()=>{map.invalidateSize();if(!fitted){map.fitBounds(frame,{padding:[10,10],maxZoom:18});fitted=true;}zoomCls();render();},60);}
window.addEventListener('hashchange',route);route();
$('#homeLogo').onclick=()=>{location.hash='';};
$('#instBtn').onclick=()=>$('#instModal').classList.add('show');
$('#instClose').onclick=()=>$('#instModal').classList.remove('show');
$('#copyBtn').onclick=()=>{const done=()=>{const b=$('#copyBtn');b.textContent=t('l_copied');setTimeout(()=>b.textContent=t('l_copy'),1800);};
  if(navigator.clipboard)navigator.clipboard.writeText(MAP_URL).then(done,done);else{const a=document.createElement('textarea');a.value=MAP_URL;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();done();}};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
